name: gpuckpt-ci
on:
  push:
    paths: ['gpuckpt/**', '.github/workflows/gpuckpt-ci.yml']
  pull_request:
    paths: ['gpuckpt/**', '.github/workflows/gpuckpt-ci.yml']
jobs:
  cuda-header-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gpuckpt
    steps:
      - uses: actions/checkout@v4
      - name: Install real NVIDIA CUDA headers (compile only)
        run: pip install nvidia-cuda-runtime==13.4.92
      - name: Compile adapter and graph workload against CUDA 13.4
        run: |
          GPUCKPT_CUDA_HOME=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["purelib"] + "/nvidia/cu13")')
          make all graph-workload CUDA_HOME="$GPUCKPT_CUDA_HOME"
          ./build/gpuckpt version | grep -q 'cuda-header: real'
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gpuckpt
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libssl-dev libcurl4-openssl-dev
      - run: pip install botocore
      - run: make
      - run: make test
      - name: sanitizers
        run: |
          make clean
          make CFLAGS="-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          ASAN_OPTIONS=detect_leaks=1 bash tests/run.sh
      - name: builtin sha256, no libcurl (pkg-config disabled)
        run: |
          make clean
          PKG_CONFIG=/bin/false make
          ./build/gpuckpt version | grep -q builtin
          ./build/gpuckpt version | grep -q "s3: unavailable"
          make test
